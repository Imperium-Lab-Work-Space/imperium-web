<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imperium Lab · Plan de arranque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: encabezado con avance, pestañas de trabajo (Hoy, Tablero, Cronograma, Fases, Marca, Ajustes) y panel lateral de detalle.
   Paleta del manual Imperial Tech / Imperium Lab con regla 60-30-10: neutros violáceos, violeta de marca, degradado solo en acentos, naranja solo para acción. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --surface-2:#EFEDF8; --surface-3:#E6E3F3;
  --ink:#14121F; --ink-2:#4E4A63; --ink-3:#6B6782; --line:#E2DFEE;
  --brand:#6A4BF0; --brand-ink:#FFFFFF; --brand-tint:#EEEAFF; --brand-text:#5B3FDB;
  --cta:#FF6B35; --cta-ink:#0D0D12;
  --mj:#1A6DBA; --mj-tint:#E2EFFB; --jq:#B8329F; --jq-tint:#FBE6F7;
  --good:#0F7A55; --good-tint:#E1F4EB; --warn:#9A5800; --warn-tint:#FFF0D6; --crit:#B42318; --crit-tint:#FDE6E3;
  --grad:linear-gradient(90deg,#7B5CFF 0%,#3B9EFF 38%,#2DD4BF 68%,#E85CD8 100%);
  --shadow:0 1px 2px rgba(20,18,31,.06),0 8px 24px -12px rgba(20,18,31,.18);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D12; --surface:#16161E; --surface-2:#1E1E29; --surface-3:#272635;
    --ink:#EDECF5; --ink-2:#B3AFC8; --ink-3:#938FAB; --line:#2B2A3A;
    --brand:#9D86FF; --brand-ink:#0D0D12; --brand-tint:#221C44; --brand-text:#B4A3FF;
    --cta:#FF6B35; --cta-ink:#0D0D12;
    --mj:#7AB8FF; --mj-tint:#12243A; --jq:#F28AE6; --jq-tint:#371634;
    --good:#4ADE9B; --good-tint:#0E2A1E; --warn:#F5B454; --warn-tint:#33240B; --crit:#FF8A80; --crit-tint:#3A1614;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D12; --surface:#16161E; --surface-2:#1E1E29; --surface-3:#272635;
  --ink:#EDECF5; --ink-2:#B3AFC8; --ink-3:#938FAB; --line:#2B2A3A;
  --brand:#9D86FF; --brand-ink:#0D0D12; --brand-tint:#221C44; --brand-text:#B4A3FF;
  --cta:#FF6B35; --cta-ink:#0D0D12;
  --mj:#7AB8FF; --mj-tint:#12243A; --jq:#F28AE6; --jq-tint:#371634;
  --good:#4ADE9B; --good-tint:#0E2A1E; --warn:#F5B454; --warn-tint:#33240B; --crit:#FF8A80; --crit-tint:#3A1614;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--grad);flex:none}
.brand h1{font-size:19px;font-weight:800;line-height:1.15}
.brand p{margin:0;color:var(--ink-3);font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saved{font-size:12.5px;color:var(--ink-3)}
.saved.err{color:var(--crit);font-weight:600}
.rule{height:3px;background:var(--grad)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.iconbtn{width:36px;height:36px;justify-content:center;padding:0}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-block:18px 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.stat .val{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px}
.bar.mj>i{background:var(--mj)} .bar.jq>i{background:var(--jq)}
.people{display:grid;gap:8px;margin-top:6px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.prow .bar{margin-top:0}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px}
.toolbar h2{font-size:20px;font-weight:700;margin-right:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding-bottom:60px}
.note{background:var(--brand-tint);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.note.warn{background:var(--warn-tint)}
.muted{color:var(--ink-3)}

/* Chips & pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.MJ{background:var(--mj-tint);color:var(--mj)} .chip.JQ{background:var(--jq-tint);color:var(--jq)} .chip.AMBAS{background:var(--brand-tint);color:var(--brand-text)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.MJ{background:var(--mj)} .dot.JQ{background:var(--jq)} .dot.AMBAS{background:var(--brand)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.pend{background:var(--surface-2);color:var(--ink-2)}
.pill.doing{background:var(--brand-tint);color:var(--brand-text)}
.pill.block{background:var(--warn-tint);color:var(--warn)}
.pill.done{background:var(--good-tint);color:var(--good)}
.pill.late{background:var(--crit-tint);color:var(--crit)}
.pill.gate{background:var(--ink);color:var(--bg)}
.tid{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-weight:600}

/* Hoy */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .d{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:180px;text-align:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.col-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.col-h .who{font-family:var(--f-display);font-weight:700;font-size:16px}
.col-h .role{font-size:12.5px;color:var(--ink-3)}
.col-h .hrs{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.col.MJ .col-h{box-shadow:inset 4px 0 0 var(--mj)} .col.JQ .col-h{box-shadow:inset 4px 0 0 var(--jq)}
.blocks{display:grid;gap:12px;padding:14px}
.block{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface);min-width:0}
.block-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block h3{font-size:15.5px;font-weight:700;margin-top:6px;line-height:1.3}
.block .why{font-size:13.5px;color:var(--ink-2);margin:6px 0 0}
.hrs-chip{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:6px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.steps li label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px}
.steps li label:hover{background:var(--surface-2)}
.steps input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--brand)}
.steps input:checked+span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.steps .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-right:4px}
.block-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.wait{font-size:12.5px;color:var(--warn);font-weight:600}
.empty{padding:22px 16px;color:var(--ink-3);font-size:14px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:200px;min-width:0}
.kcol.over{outline:2px dashed var(--brand);outline-offset:-4px}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:700;font-size:14px}
.kcol-h .c{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-left:auto}
.kcards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;text-align:left;width:100%;display:grid;gap:6px}
.card:hover{border-color:var(--ink-3)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:600;font-size:14px;line-height:1.3}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.mini{height:4px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--brand)}

/* Cronograma */
.weeks{display:grid;gap:14px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week-h{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.week-h h3{font-size:15px}
.week-h .r{font-size:13px;color:var(--ink-3)}
.week-h .g{margin-left:auto}
.gridwrap{overflow-x:auto}
.wgrid{display:grid;grid-template-columns:110px repeat(5,minmax(130px,1fr));min-width:760px}
.wgrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-width:0}
.wgrid>div:nth-child(6n){border-right:0}
.wgrid .hd{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
.wgrid .hd.today{color:var(--brand-text);background:var(--brand-tint)}
.wgrid .rowlbl{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.wgrid .off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);font-size:12px;color:var(--ink-3)}
.wgrid .cell{display:grid;gap:5px;align-content:start}
.wgrid .cell.today{background:color-mix(in srgb,var(--brand-tint) 55%,transparent)}
.tchip{display:grid;gap:1px;text-align:left;border:0;border-left:3px solid var(--line);background:var(--surface-2);padding:5px 7px;border-radius:5px;font-size:12px;cursor:pointer;line-height:1.3;width:100%}
.tchip.MJ{border-left-color:var(--mj)} .tchip.JQ{border-left-color:var(--jq)} .tchip.AMBAS{border-left-color:var(--brand)}
.tchip b{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tchip.done{opacity:.6} .tchip.done span{text-decoration:line-through}
.tchip.late{background:var(--crit-tint)}

/* Fases */
.phases{display:grid;gap:14px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.phase-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.phase-h .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-weight:600}
.phase-h h3{font-size:18px}
.phase-h .pct{margin-left:auto;font-family:var(--f-display);font-size:22px;font-weight:700}
.gate{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.diamond{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--ink-2);flex:none}
.diamond.ok{background:var(--good);border-color:var(--good)}
.tlist{display:grid;margin-top:12px;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:62px 1fr auto auto;gap:10px;align-items:center;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;font-size:14px}
.trow:hover{background:var(--surface-2)}
.trow .t{min-width:0}
.trow .dates{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
@media (max-width:600px){.trow{grid-template-columns:52px 1fr auto}.trow .dates{display:none}}

/* Marca */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sw .c{height:86px;display:flex;align-items:flex-end;padding:8px 10px;gap:6px}
.sw .c span{font-size:13px;font-weight:700;padding:1px 6px;border-radius:4px}
.sw .b{padding:10px 12px;display:grid;gap:4px;font-size:13px}
.sw .b strong{font-size:14px}
.cr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12.5px}.cr .mono{white-space:nowrap}
.ok{color:var(--good);font-weight:700} .bad{color:var(--crit);font-weight:700} .mid{color:var(--warn);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:8px}
.changes{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.pair .demo{padding:6px 12px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}

/* Ajustes */
.form{display:grid;gap:14px;max-width:720px}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--brand);margin-top:2px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(13,13,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px)}
.dr-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dr-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-top .x{margin-left:auto}
.dr-h h2{font-size:19px;line-height:1.25}
.dr-b{padding:16px 18px 40px;overflow-y:auto;display:grid;gap:18px;align-content:start;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 6px;font-family:var(--f-body)}
.sec p{margin:0;font-size:14.5px}
.statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.statuses button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 4px;font-weight:600;font-size:13px;cursor:pointer}
.statuses button[aria-pressed="true"].pend{background:var(--surface-3);border-color:var(--ink-3)}
.statuses button[aria-pressed="true"].doing{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-text)}
.statuses button[aria-pressed="true"].block{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
.statuses button[aria-pressed="true"].done{background:var(--good-tint);border-color:var(--good);color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.res{display:grid;gap:4px;font-size:14px;margin:0;padding-left:18px}
.notes{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;resize:vertical}
.deps{display:flex;gap:6px;flex-wrap:wrap}
.deps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:60}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-tint);padding:10px 12px;border-radius:var(--r-sm);font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .drawer.anim{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Imperium Lab · Plan de arranque</h1>
        <p id="subtitle">Dos socias · 2 horas al día cada una</p>
      </div>

      while (cap(cur.MJ) < need || cap(cur.JQ) < need) day++;

        const c = cur[p];

function renderCrono() {

    const key = s.p + "|" + s.d; (per[key] = per[key] || []).push({ t, h: s.h });
  }
  let mon = state.start; while (dow(mon) !== 1) mon = isoAdd(mon, -1);
  const weeks = []; let wn = 1;
  while (mon <= lastDay) {
    const dates = [0, 1, 2, 3, 4].map(i => isoAdd(mon, i));
    const gates = TASKS.filter(t => t.gate && dates.includes(dEnd(t.id)));
    let grid = '<div class="hd"></div>' + dates.map(d => '<div class="hd' + (d === TODAY ? " today" : "") + '">' + fmt(d) + "</div>").join("");
    for (const p of who) {

/* ---------- marca ---------- */
function lum(hex) {
  const h = hex.replace("#", ""); const c = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function ratio(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

  ["Misión y posicionamiento («micronegocios que no pueden pagar una agencia»): alinear con la vertical y los precios decididos.", ["T04", "T05", "T26"]],
  ["Contraste: violeta con texto blanco 4,36:1 y naranja con texto blanco 2,84:1 no pasan WCAG AA para texto normal.", ["T25"]],

    '<div class="dr-b">' +
    '<div class="sec"><h4>Por qué</h4><p>' + esc(t.why) + "</p></div>" +
    '<div class="sec"><dl class="kv"><dt>Responsable</dt><dd>' + esc(ownerLabel(t.o)) + (t.o === "AMBAS" ? " (sesión conjunta)" : "") + "</dd><dt>Esfuerzo</dt><dd>" + t.h + " h" + (t.o === "AMBAS" ? " cada una" : "") + "</dd><dt>Fechas</dt><dd class=\"mono\">" + range(t.id) + "</dd><dt>Sesiones</dt><dd>" + sessions + "</dd></dl></div>" +
    '<div class="sec"><h4>Paso a paso · ' + n + " de " + t.steps.length + "</h4>" + stepsList(t.id) +
    (n === t.steps.length && st !== "done" ? '<div style="margin-top:8px"><button class="btn primary" data-status="' + t.id + '|done">Todos los pasos listos: marcar hecha</button></div>' : "") + "</div>" +
    '<div class="sec"><h4>Entregable</h4><p>' + esc(t.out) + '</p></div><div class="sec"><h4>Listo cuando</h4><p>' + esc(t.done) + "</p></div>" +
    (deps ? '<div class="sec"><h4>Necesita antes</h4><div class="deps">' + deps + "</div></div>" : "") +
    (after ? '<div class="sec"><h4>Desbloquea</h4><div class="deps">' + after + "</div></div>" : "") +
    (res ? '<div class="sec"><h4>Fuentes y recursos</h4><ul class="res">' + res + "</ul></div>" : "") +
    '<div class="sec"><h4>Notas</h4><textarea class="notes" id="notes" data-notes="' + t.id + '" placeholder="Decisiones, enlaces, pendientes…">' + esc(s.notes || "") + "</textarea></div>" +
    '<div class="sec" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="' + gcalUrl(t.id) + '" target="_blank" rel="noopener">Agregar a Google Calendar</a><button class="btn" data-copysteps="' + t.id + '">Copiar paso a paso</button></div>' +
    "</div></aside>";
  const nb = root.querySelector(".dr-b"); if (nb && !anim) nb.scrollTop = prevScroll;
  const x = root.querySelector(".x"); if (x && !root.dataset.focused) { x.focus(); root.dataset.focused = "1"; }
}
function openTask(id) { ui.drawer = id; ui.justOpened = true; document.getElementById("drawerRoot").dataset.focused = ""; renderDrawer(); }
function closeDrawer() { ui.drawer = null; renderDrawer(); }

/* ---------- main render ---------- */
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === ui.view)));
  const v = document.getElementById("view");
  const fn = { hoy: renderHoy, tablero: renderTablero, crono: renderCrono, fases: renderFases, marca: renderMarca, ajustes: renderAjustes }[ui.view];
  v.innerHTML = fn();
  document.getElementById("subtitle").textContent = name("MJ") + " y " + name("JQ") + " · " + state.hpd + " h al día cada una · desde " + fmt(state.start);
}
function refresh() { computeSchedule(); renderSummary(); render(); renderDrawer(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-open],[data-status],[data-act],[data-who],[data-copy],[data-copysteps],.tab");
  if (!el) return;
  if (el.classList.contains("tab")) { ui.view = el.dataset.view; render(); if (ui.view === "crono") { const w = document.getElementById("thisweek"); if (w) w.scrollIntoView({ block: "start" }); } return; }
  if (el.dataset.status) { const [id, st] = el.dataset.status.split("|"); setStatus(id, st); return; }
  if (el.dataset.open) { e.preventDefault(); openTask(el.dataset.open); return; }
  if (el.dataset.who) { ui.who = el.dataset.who; render(); return; }
  if (el.dataset.copy) { copyText(el.dataset.copy, "Copiado " + el.dataset.copy); return; }
  if (el.dataset.copysteps) { copyText(stepsText(el.dataset.copysteps), "Paso a paso copiado"); return; }
  const a = el.dataset.act;
  if (a === "close") closeDrawer();
  else if (a === "dayprev" || a === "daynext") {
    const i = CAL.days.findIndex(d => d >= ui.day);
    const cur = CAL.days[i] === ui.day ? i : (a === "dayprev" ? i : i - 1);
    const ni = Math.max(0, cur + (a === "daynext" ? 1 : -1));
    ui.day = CAL.days[ni]; render();
  }
  else if (a === "daytoday") { ui.day = workdayOnOrAfter(TODAY < state.start ? state.start : TODAY); render(); }
  else if (a === "export") exportJSON();
  else if (a === "copyweek") copyText(weekSummary(), "Resumen copiado");
  else if (a === "reset") { ui.confirmReset = true; render(); }
  else if (a === "resetno") { ui.confirmReset = false; render(); }
  else if (a === "resetyes") { const keep = { names: state.names, roles: state.roles, start: state.start, hpd: state.hpd, holidays: state.holidays }; state = Object.assign(defaults(), keep); ui.confirmReset = false; save(); refresh(); toast("Progreso borrado"); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.step) { const [id, i] = el.dataset.step.split("|"); toggleStep(id, Number(i), el.checked); return; }
  if (el.id === "phaseSel") { ui.phase = el.value; render(); return; }
  if (el.id === "importFile" && el.files && el.files[0]) { importJSON(el.files[0]); el.value = ""; return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === "names.MJ" || k === "names.JQ") state.names[k.split(".")[1]] = el.value.slice(0, 40);
    else if (k === "start") { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { state.start = el.value; ui.day = null; } }
    else if (k === "hpd") state.hpd = Number(el.value);
    else if (k === "holidays") state.holidays = el.value.split(/\s+/).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
    else if (k === "replan") state.replan = el.checked;
    save(); computeSchedule(); renderSummary();
    document.getElementById("subtitle").textContent = name("MJ") + " y " + name("JQ") + " · " + state.hpd + " h al día cada una · desde " + fmt(state.start);
    toast("Ajuste guardado");
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.notes) { ts(el.dataset.notes).notes = el.value; saveSoon(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.drawer) closeDrawer(); });
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest("[data-drag]"); if (!c) return; dragId = c.dataset.drag; try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {} });
document.addEventListener("dragover", e => { const col = e.target.closest("[data-drop]"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".kcol.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("dragleave", e => { const col = e.target.closest("[data-drop]"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e => { const col = e.target.closest("[data-drop]"); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; if (stOf(id) !== col.dataset.drop) setStatus(id, col.dataset.drop); else render(); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".kcol.over").forEach(x => x.classList.remove("over")); });

/* ---------- export / import ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "imperium-lab-progreso-" + TODAY + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Archivo exportado");
}
function importJSON(file) {
  const r = new FileReader();
  r.onload = () => {
    try { const s = JSON.parse(r.result); if (!s || s.v !== 1) throw new Error("v"); state = merge(null, s); save(); ui.day = null; refresh(); toast("Progreso importado"); }
    catch (e) { toast("Ese archivo no es un progreso de este plan"); }
  };
  r.readAsText(file);
}
function weekSummary() {
  let mon = TODAY; while (dow(mon) !== 1) mon = isoAdd(mon, -1);
  const dates = [0, 1, 2, 3, 4].map(i => isoAdd(mon, i));
  const lines = ["Imperium Lab · semana del " + fmt(dates[0]) + " · avance " + pctFor(TASKS) + "%"];
  for (const p of PEOPLE) {
    lines.push("", name(p) + ":");
    const seen = new Set();
    for (const d of dates) { const di = CAL.idx[d]; if (di === undefined) continue;
      for (const t of personTasks(p)) if (!seen.has(t.id) && sOf(t.id).slices.some(s => s.d === di && s.p === p)) { seen.add(t.id); lines.push("- " + t.id + " " + t.t + " · " + STATUS[stOf(t.id)]); } }
    if (!seen.size) lines.push("- Sin tareas asignadas");
  }
  const late = TASKS.filter(t => isLate(t.id));
  if (late.length) lines.push("", "Atrasadas: " + late.map(t => t.id).join(", "));
  return lines.join("\n");
}

/* ---------- theme ---------- */
function applyTheme(t) { if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
let theme = null; try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; applyTheme(next); try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* ---------- boot ---------- */
if (state.savedAt) setSaved("Guardado " + hhmm(state.savedAt)); else if (!storageOK) setSaved("Este navegador no guarda: usa Exportar", true);
refresh();
})();

</script>
</body>
